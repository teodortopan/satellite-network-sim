name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job builds the same image (layer-cached) and runs one scripts/ci.sh step,
# so CI runs exactly what scripts/check.sh runs locally.

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: satsim-ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm --cap-add=SYS_PTRACE -v "$PWD":/work -w /work satsim-ci scripts/ci.sh format

  python-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: satsim-ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm --cap-add=SYS_PTRACE -v "$PWD":/work -w /work satsim-ci scripts/ci.sh python-lint

  asan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: satsim-ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Sanitizer runtimes from LLVM 18 / GCC 13 can fail to map shadow memory with the
      # high ASLR entropy (vm.mmap_rnd_bits=32) of recent runner kernels. Containers share
      # the host kernel, so lower it on the runner.
      - run: sudo sysctl -w vm.mmap_rnd_bits=28
      - run: docker run --rm --cap-add=SYS_PTRACE -v "$PWD":/work -w /work satsim-ci scripts/ci.sh asan-${{ matrix.compiler }}

  valgrind:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: satsim-ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm --cap-add=SYS_PTRACE -v "$PWD":/work -w /work satsim-ci scripts/ci.sh valgrind

  tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: satsim-ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm --cap-add=SYS_PTRACE -v "$PWD":/work -w /work satsim-ci scripts/ci.sh tidy

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: satsim-ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # No network inside the container: the comparison must read only the committed files.
      - run: docker run --rm --network none -v "$PWD":/work -w /work satsim-ci scripts/ci.sh validate

  validate-topology:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: satsim-ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # No network inside the container: the ideal shell is written from the committed files.
      - run: docker run --rm --network none -v "$PWD":/work -w /work satsim-ci scripts/ci.sh validate-topology

  validate-routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: satsim-ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # No network inside the container: the shells are written from the committed files.
      - run: docker run --rm --network none -v "$PWD":/work -w /work satsim-ci scripts/ci.sh validate-routing

  validate-failures:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: satsim-ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # No network inside the container: the shell is written from the committed files.
      - run: docker run --rm --network none -v "$PWD":/work -w /work satsim-ci scripts/ci.sh validate-failures

  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: satsim-ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The network is needed once, for `npm ci`.
      - run: docker run --rm -v "$PWD":/work -w /work satsim-ci scripts/ci.sh dashboard
